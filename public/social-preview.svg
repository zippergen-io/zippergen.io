<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ZipperGen social preview</title>
  <desc id="description">ZipperGen logo, product message, and a live CLI inspection view.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#13202f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="103" cy="546" r="180" fill="#e94f2e" opacity="0.07"/>

  <image href="zippergen-lockup-ink.svg" x="72" y="58" width="260" height="57"/>

  <text x="72" y="224" fill="#14141a" font-family="Atkinson, Inter, system-ui, sans-serif" font-size="58" font-weight="700">
    <tspan x="72" dy="0">Global workflows</tspan>
    <tspan x="72" dy="68">for LLM agents</tspan>
  </text>

  <text x="72" y="390" fill="#3a4151" font-family="Atkinson, Inter, system-ui, sans-serif" font-size="25">
    <tspan x="72" dy="0">Readable protocols. Durable runs.</tspan>
    <tspan x="72" dy="38">Live local projections. Real deployment.</tspan>
  </text>

  <rect x="72" y="500" width="348" height="48" rx="8" fill="#14141a"/>
  <text x="246" y="532" text-anchor="middle" fill="#ffffff" font-family="Atkinson, Inter, system-ui, sans-serif" font-size="20" font-weight="700">zippergen.io</text>

  <g filter="url(#shadow)">
    <rect x="676" y="30" width="476" height="570" rx="16" fill="#ffffff" stroke="#d0d7de"/>
    <path d="M692 30h444a16 16 0 0 1 16 16v50H676V46a16 16 0 0 1 16-16z" fill="#14141a"/>
    <circle cx="704" cy="63" r="6" fill="#e94f2e"/>
    <circle cx="724" cy="63" r="6" fill="#eab464"/>
    <circle cx="744" cy="63" r="6" fill="#62b27f"/>
    <text x="772" y="70" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600">zg deploy inspect --agent Writer</text>

    <g fill="#14141a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="704" y="132" font-size="18" font-weight="700">Execution positions</text>
      <text x="704" y="156" font-size="16" fill="#13728f">═══════════════════</text>
      <text x="704" y="190" font-size="15" fill="#667085">Participant</text>
      <text x="868" y="190" font-size="15" fill="#667085">State</text>
      <text x="704" y="221" font-size="16">Mailbox</text>
      <text x="868" y="221" font-size="16">waiting</text>
      <text x="704" y="251" font-size="16">Writer</text>
      <text x="868" y="251" font-size="16">waiting receive</text>

      <text x="704" y="302" font-size="18" font-weight="700">Writer local projection</text>
      <text x="704" y="326" font-size="16" fill="#13728f">═══════════════════════</text>
      <text x="704" y="365" font-size="15" fill="#667085">@role('Writer')</text>
      <text x="704" y="394" font-size="15">def email_approval__Writer():</text>
      <text x="718" y="431" font-size="20" fill="#e94f2e">▶</text>
      <text x="748" y="431" font-size="15">message = recv('Mailbox')</text>
      <text x="748" y="462" font-size="15">draft = draft_reply(message)</text>
      <text x="748" y="493" font-size="15">send('User', draft)</text>
      <text x="748" y="524" font-size="15">approved = recv('User')</text>
      <text x="748" y="555" font-size="15">send('Mailbox', approved)</text>
    </g>
  </g>
</svg>
